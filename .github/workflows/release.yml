name: release
'on':
  push:
    tags:
    - v*
  workflow_call:
    inputs:
      core_only:
        description: 'Только прогрев ядра: APK не собирать'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      core_ref:
        description: Тег/ветка ядра sing-box
        required: false
        default: v1.14.1
      kelevra_build:
        description: Номер сборки для проверочного APK без тега (пусто — номер прогона)
        required: false
        default: ''
env:
  NDK_VERSION: 28.0.13004108
  CORE_REPO: SagerNet/sing-box
  CORE_REF: ${{ github.event.inputs.core_ref || 'v1.14.1' }}
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: main
          androidapi: 24
          aar: libbox.aar
          artifact: core-libbox
          extra_tags: ',with_naive_outbound'
        - variant: legacy
          androidapi: 21
          aar: libbox-legacy.aar
          artifact: core-libbox-legacy
          extra_tags: ''
    name: core (${{ matrix.variant }})
    steps:
    - name: Checkout app
      uses: actions/checkout@v5
      with:
        path: sing-box-for-android
        submodules: recursive
    - name: Кеш ядра
      id: core-cache
      uses: actions/cache/restore@v5
      with:
        path: sing-box-for-android/app/libs/${{ matrix.aar }}
        key: libbox-own-xhttp-v1-${{ matrix.variant }}-${{ env.CORE_REF }}-${{ hashFiles('sing-box-for-android/cores/go.mod', 'sing-box-for-android/core-xhttp/**') }}
    - name: Checkout sing-box core
      if: steps.core-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v5
      with:
        repository: ${{ env.CORE_REPO }}
        ref: ${{ env.CORE_REF }}
        path: sing-box
        fetch-depth: 0
    - name: Setup Go
      if: steps.core-cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v6
      with:
        cache: false
        go-version: 1.26.3
    - name: Кеш Go-модулей
      id: gomod-cache
      if: steps.core-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: gomod-own-xhttp-${{ matrix.variant }}-${{ env.CORE_REF }}-${{ hashFiles('sing-box-for-android/cores/go.mod') }}
        restore-keys: |
          gomod-own-xhttp-${{ matrix.variant }}-${{ env.CORE_REF }}-
          gomod-own-xhttp-${{ matrix.variant }}-
          gomod-own-xhttp-
    - name: Setup JDK
      if: steps.core-cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Кеш Gradle
      if: steps.core-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    - name: Setup Android SDK
      if: steps.core-cache.outputs.cache-hit != 'true'
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Install NDK
      if: steps.core-cache.outputs.cache-hit != 'true'
      run: |
        sdkmanager --install "ndk;$NDK_VERSION"
    - name: Патч ядра (xhttp)
      if: steps.core-cache.outputs.cache-hit != 'true'
      run: |
        python3 sing-box-for-android/core-xhttp/apply.py sing-box
    - name: Install gomobile
      if: steps.core-cache.outputs.cache-hit != 'true'
      working-directory: sing-box
      run: |
        make lib_install
    - name: Подготовка модуля cores
      if: steps.core-cache.outputs.cache-hit != 'true'
      working-directory: sing-box-for-android/cores
      run: |
        go mod edit -replace=github.com/sagernet/sing-box="$GITHUB_WORKSPACE/sing-box"
        go mod tidy
    - name: Создать app/libs
      run: |
        mkdir -p sing-box-for-android/app/libs
    - name: Build объединённое ядро
      if: steps.core-cache.outputs.cache-hit != 'true'
      working-directory: sing-box-for-android/cores
      run: |
        export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
        export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
        export PATH="$PATH:$(go env GOPATH)/bin"

        # версия ядра ровно как её считает build_shared.ReadTag (тег без ведущей v)
        VERSION=$(cd "$GITHUB_WORKSPACE/sing-box" && git describe --tags | sed 's/^v//')
        echo "версия ядра: $VERSION"

        # теги 1:1 из cmd/internal/build_libbox/main.go (sharedTags) ПЛЮС http2legacy;
        # http2legacy наш, апстриму он не нужен: начиная с golang.org/x/net v0.57.0
        # (тянется ядром v1.14.1) старая реализация http2/transport.go собирается
        # только под `//go:build !(go1.27 && !http2legacy)`. Наш //go:linkname на
        # http2.(*Transport).connPool в core-xhttp/v2rayxhttp/dialer.go держит
        # DefaultDialerClient.Close() — принудительное закрытие ВСЕХ, а не только
        # простаивающих, HTTP/2-соединений xhttp, когда соединение xmux выбыло и на нём не
        # осталось сессий (ошибка одного запроса его больше не рвёт); публичного API
        # для этого нет. Без тега на toolchain 1.27 линковка падает:
        # relocation target golang.org/x/net/http2.(*Transport).connPool not defined
        # (замерено 16.09.2026 на go1.27.0: без тега RC=1, с тегом RC=0). На Go 1.26,
        # который ставится сейчас, тег ничего не меняет. Снимать — только вместе с linkname.
        # with_naive_outbound
        # приезжает из матрицы: у legacy апстрим его выкидывает (filterTags).
        TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,http2legacy,with_tailscale,ts_omit_logtail,ts_omit_ssh,ts_omit_drive,ts_omit_taildrop,ts_omit_webclient,ts_omit_doctor,ts_omit_capture,ts_omit_kube,ts_omit_aws,ts_omit_synology,ts_omit_bird${{ matrix.extra_tags }}"
        LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=$VERSION -X runtime.godebugDefault=multipathtcp=0,tlssha1=1,tlsunsafeekm=1 -checklinkname=0 -s -w -buildid="

        # релиз собирает все ABI: сплиты APK делаются на armeabi-v7a/arm64-v8a/x86/x86_64
        gomobile bind -v \
          -o "../app/libs/${{ matrix.aar }}" \
          -target android \
          -androidapi ${{ matrix.androidapi }} \
          -javapkg=io.nekohasekai \
          -libname=box \
          -trimpath \
          -buildvcs=false \
          -ldflags "$LDFLAGS" \
          -tags "$TAGS" \
          github.com/sagernet/sing-box/experimental/libbox
    - name: Проверка содержимого .aar
      working-directory: sing-box-for-android
      run: |
        AAR=app/libs/${{ matrix.aar }}
        test -f "$AAR" || { echo "ОШИБКА: .aar не собран"; exit 1; }
        ls -la app/libs/
        SO_NAMES=$(unzip -l "$AAR" | grep -oE '[^/ ]+\.so$' | sort -u)
        echo "уникальные имена .so: $SO_NAMES"
        test "$(echo "$SO_NAMES" | wc -l)" -eq 1 || { echo "ОШИБКА: в .aar больше одной нативной библиотеки"; exit 1; }
        mkdir -p /tmp/aar && unzip -o -q "$AAR" classes.jar -d /tmp/aar
        unzip -l /tmp/aar/classes.jar > /tmp/classes.txt
        LIBBOX=$(grep -cE 'io/nekohasekai/libbox/.*\.class' /tmp/classes.txt || true)
        test "$LIBBOX" -gt 0 || { echo "ОШИБКА: нет классов sing-box"; exit 1; }
    - name: Проверка что транспорт xhttp внутри
      working-directory: sing-box-for-android
      run: |
        mkdir -p /tmp/socheck && unzip -o -q "app/libs/${{ matrix.aar }}" 'jni/*/*.so' -d /tmp/socheck
        SO=$(find /tmp/socheck -name '*.so' | head -1)
        grep -qa 'v2rayxhttp' "$SO" && echo "транспорт xhttp внутри ядра: есть" || { echo "ОШИБКА: ядро собрано без патча xhttp"; exit 1; }
    - name: Сохранить кеш ядра
      if: steps.core-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
      uses: actions/cache/save@v5
      with:
        path: sing-box-for-android/app/libs/${{ matrix.aar }}
        key: ${{ steps.core-cache.outputs.cache-primary-key }}
    - name: Сохранить кеш Go-модулей
      if: steps.core-cache.outputs.cache-hit != 'true' && steps.gomod-cache.outputs.cache-hit != 'true' && !startsWith(github.ref, 'refs/tags/')
      uses: actions/cache/save@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.gomod-cache.outputs.cache-primary-key }}
    - name: Upload core
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact }}
        path: sing-box-for-android/app/libs/${{ matrix.aar }}
        if-no-files-found: error
  release:
    needs: core
    if: ${{ !cancelled() && !inputs.core_only && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout app
      uses: actions/checkout@v5
      with:
        path: sing-box-for-android
        submodules: recursive
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Кеш Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Забрать ядро из job core
      uses: actions/download-artifact@v7
      with:
        pattern: core-libbox*
        merge-multiple: true
        path: sing-box-for-android/app/libs
    - name: Проверка что ядро на месте
      run: |
        ls -la sing-box-for-android/app/libs/
        test -f sing-box-for-android/app/libs/libbox.aar || { echo "ОШИБКА: ядро не собралось"; exit 1; }
    - name: Подготовка подписи
      working-directory: sing-box-for-android
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
        printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEYSTORE_PASS" > /tmp/local.properties
        echo "LOCAL_PROPERTIES=$(base64 -w0 /tmp/local.properties)" >> $GITHUB_ENV
        rm -f /tmp/local.properties
        test -s app/release.keystore
    - name: Номер сборки — из тега, а не из номера прогона
      env:
        KELEVRA_BUILD_INPUT: ${{ github.event.inputs.kelevra_build }}
      run: |
        set -e
        # Проверочная сборка без тега ставится поверх установленной версии только с
        # номером выше её, а номер прогона ниже номеров выпусков. Поэтому при ручном
        # запуске номер можно задать явно; на выпуск по тегу это не влияет.
        if [ "$GITHUB_REF_TYPE" != "tag" ] && printf '%s' "$KELEVRA_BUILD_INPUT" | grep -Eq '^[0-9]+$'; then
          echo "KELEVRA_BUILD=$KELEVRA_BUILD_INPUT" >> "$GITHUB_ENV"
          echo "номер сборки задан при запуске: $KELEVRA_BUILD_INPUT"
          exit 0
        fi
        # Номер прогона живёт своей жизнью (перезапуски, отменённые сборки, прогоны
        # других веток), и 10.08.2026 тег kelevra58 выпустил версию 1.14.54: имя тега
        # и версия разъехались, а телефон с более высоким номером обновление с сервера
        # уже не принимал. Берём номер из имени тега; без тега остаётся прогон.
        n="${GITHUB_REF_NAME#v1.14.0-kelevra}"
        if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$n" != "$GITHUB_REF_NAME" ] && [ -n "$n" ]; then
          echo "KELEVRA_BUILD=$n" >> "$GITHUB_ENV"
          echo "номер сборки из тега: $n"
        else
          echo "KELEVRA_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "тега нет, номер сборки из прогона: $GITHUB_RUN_NUMBER"
        fi
    - name: Unit tests for personal client
      working-directory: sing-box-for-android
      run: |
        chmod +x gradlew
        ./gradlew :app:testOtherDebugUnitTest --no-daemon
      env:
        LC_ALL: C.UTF-8
    - name: Build APK
      working-directory: sing-box-for-android
      run: |
        chmod +x gradlew
        ./gradlew assembleOtherRelease --no-daemon
    - name: Проверка что транспорт в APK
      working-directory: sing-box-for-android
      run: |
        APK=$(find app/build/outputs/apk -name '*arm64*.apk' | head -1)
        test -n "$APK" || { echo "APK не найден"; exit 1; }
        mkdir -p /tmp/apkcheck && unzip -o -q "$APK" 'lib/*/libbox.so' -d /tmp/apkcheck
        SO=$(find /tmp/apkcheck -name libbox.so | head -1)
        if grep -qa 'v2rayxhttp' "$SO"; then
          echo "транспорт xhttp внутри APK: есть"
        else
          echo "ОШИБКА: в libbox.so нет транспорта xhttp — ядро собрано без патча"
          exit 1
        fi
    - name: Метаданные версии
      run: |
        # Номер берём ТОТ ЖЕ, что у APK ($KELEVRA_BUILD из имени тега), а не номер
        # прогона. Пока здесь стоял github.run_number, релиз kelevra67 выкладывал APK
        # 1.14.67 и файл версии 1.14.59 — приложение сравнивало себя с чужим номером
        # и обновление не предлагало вовсе (поймано на живом устройстве 11.08.2026).
        # ровно та же формула, что versionCode в app/build.gradle.kts
        VERSION_CODE=$(grep '^VERSION_CODE=' sing-box-for-android/version.properties | cut -d= -f2)
        CODE=$(( VERSION_CODE * 1000 + KELEVRA_BUILD ))
        echo "{\"version_code\": $CODE, \"version_name\": \"1.14.$KELEVRA_BUILD\"}" > kelevra-version.json
        cat kelevra-version.json
    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: kelevra-apk-release
        path: |
          sing-box-for-android/app/build/outputs/apk/**/*arm64*.apk
          kelevra-version.json
          sing-box-for-android/dveri.json
        if-no-files-found: error
    - name: Публикация релиза
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: |
          sing-box-for-android/app/build/outputs/apk/**/*arm64*.apk
          kelevra-version.json
          sing-box-for-android/dveri.json
        prerelease: false
        generate_release_notes: true
    - name: Upload unit test report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: personal-unit-tests
        path: sing-box-for-android/app/build/reports/tests/testOtherDebugUnitTest/
        if-no-files-found: ignore
